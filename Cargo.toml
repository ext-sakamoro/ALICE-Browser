[package]
name = "alice-browser"
version = "0.2.0"
edition = "2021"
license = "LicenseRef-Proprietary"
publish = false
description = "The Web Recompiled — Semantic browser powered by ALICE ecosystem. Deep-Fried Rust: SoA+SIMD, Branchless, FMA, Division Exorcism."
repository = "https://github.com/ext-sakamoro/ALICE-Browser"
keywords = ["browser", "sdf", "ternary", "simd", "mobile"]

[[bin]]
name = "alice-browser"
path = "src/main.rs"

[lib]
name = "alice_browser"
path = "src/lib.rs"

[dependencies]
# Web fetching & parsing
reqwest = { version = "0.12", features = ["blocking"] }
scraper = "0.20"
url = "2"

# GUI
eframe = "0.29"
egui = "0.29"

# Image decoding
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }

# Utilities
log = "0.4"
env_logger = "0.11"

# Parallel rendering
rayon = "1.10"

# ALICE ecosystem (optional, git dependencies on branch main)
alice-ml = { git = "https://github.com/ext-sakamoro/ALICE-ML", branch = "main", version = "0.4.0", optional = true }
alice-sdf = { git = "https://github.com/ext-sakamoro/ALICE-SDF", branch = "main", version = "7.0.0", default-features = false, features = ["gpu"], optional = true }
alice-lol = { git = "https://github.com/ext-sakamoro/ALICE-LOL", branch = "main", version = "0.5.0", optional = true }
alice-cache = { git = "https://github.com/ext-sakamoro/ALICE-Cache", branch = "main", version = "0.2.0", optional = true }
alice-search = { git = "https://github.com/ext-sakamoro/ALICE-Search", branch = "main", version = "0.2.0", optional = true }
alice-analytics = { git = "https://github.com/ext-sakamoro/ALICE-Analytics", branch = "main", version = "0.7.0", optional = true }
alice-text = { git = "https://github.com/ext-sakamoro/ALICE-Text", branch = "main", version = "2.0.0", optional = true }
alice-cdn = { git = "https://github.com/ext-sakamoro/ALICE-CDN", branch = "main", version = "0.2.0", optional = true }

# GPU rendering (same versions as ALICE-SDF)
wgpu = { version = "23", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1.21", features = ["derive"], optional = true }

[features]
default = ["sdf-render"]
ml-filter = ["dep:alice-ml"]
sdf-render = ["dep:alice-sdf", "dep:wgpu", "dep:pollster", "dep:bytemuck"]
lol = ["dep:alice-lol", "sdf-render"]
smart-cache = ["dep:alice-cache"]
search = ["dep:alice-search"]
telemetry = ["dep:alice-analytics"]
text = ["dep:alice-text"]
cache = ["smart-cache"]  # Alias for smart-cache (backward compatibility)
mobile = ["smart-cache", "search"]
cdn = ["dep:alice-cdn"]  # ALICE-CDN Vivaldi coordinate routing
view-sdf = []  # SDF-based resolution-independent UI
sdf-web = []  # Web SDF scene evaluation
voice-web = []  # Browser voice activity detection
alice-full = ["ml-filter", "sdf-render", "smart-cache", "search", "telemetry", "cdn", "view-sdf", "sdf-web", "voice-web"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release.build-override]
opt-level = 3

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
