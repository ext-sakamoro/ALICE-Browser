name: CI

on:
  push:
    branches: [main, 'ci/**']

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      # the ALICE crates are git dependencies (branch main): cargo fetches the real ones, nothing is
      # checked out next to this repository and no crate is stubbed
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build (default)
        run: cargo build --lib

      - name: Test
        run: cargo test --lib

      - name: Clippy (telemetry)
        run: cargo clippy --lib --profile test --no-default-features --features telemetry -- -D warnings

      - name: Test (telemetry)
        run: cargo test --lib --no-default-features --features telemetry

      # every bridge against the real crate (ml-filter, lol, search, text, cdn, smart-cache, telemetry)
      - name: Clippy (all features)
        run: cargo clippy --lib --profile test --all-features -- -D warnings

      - name: Test (all features)
        run: cargo test --lib --all-features

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt -- --check

  actionlint:
    name: actionlint (workflow YAML 検証)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check
